<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiny Patiala</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#efe2cf;font-family:Arial,sans-serif}canvas{display:block}.hud{position:fixed;z-index:3;left:24px;right:24px;top:20px;display:flex;justify-content:space-between;align-items:start;color:#30251e}.hud small{font-size:10px;letter-spacing:.16em}.hud h1{font:400 42px/1 Georgia,serif;margin:3px 0}.hud button{border:1px solid #5c514455;background:#f6f0e7dd;padding:11px 15px;border-radius:99px;min-height:44px;transition:.35s cubic-bezier(.16,1,.3,1)}.hud button:hover{transform:translateY(-2px)}.hud button:active{transform:scale(.94)}.tag,.help{position:fixed;z-index:3;bottom:20px;background:#f6f0e7df;padding:9px 12px;border-radius:5px;color:#30251e;font-size:12px}.tag{left:24px}.help{right:24px;background:none;opacity:.6}.secret{position:fixed;z-index:4;top:90px;left:50%;transform:translate(-50%,-8px);opacity:0;background:#fff7e9;color:#9b2e23;padding:9px 13px;border-radius:99px;font-size:12px;transition:.45s}.secret.show{opacity:1;transform:translate(-50%,0)}body.night .hud{color:#f3e6cf}body.night .hud button{color:#f3e6cf;background:#171e27dd;border-color:#ffffff44}body.night .tag{color:#f3e6cf;background:#171e27dd}@media(max-width:600px){.hud{left:16px;right:16px}.hud h1{font-size:35px}.tag{left:16px}.help{display:none}}</style></head><body><div class="hud"><div><small>30.3248° N · 76.4040° E</small><h1>Patiala</h1></div><button id="mode">After dark</button></div><div class="tag">Qila Mubarak precinct</div><div class="help">Drag to turn · scroll to zoom</div><div class="secret">A little Patiala kite found you.</div><script><script src="app.js"></script></body></html>
